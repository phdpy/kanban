<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kanban - Projetos</title>

   <!--<link rel="stylesheet" href="src/css/style.css?v=4">-->
   <link rel="stylesheet" href="src/css/style.css?v=6">
</head>

<body class="pagina-projetos">
    <header class="cabecalho">
        <nav aria-label="Navegação principal">
            <a class="link-voltar" href="index.html">
                ← Voltar ao Kanban
            </a>
        </nav>

        <h1>Gerenciar projetos</h1>
        <p>Organize os projetos que receberão as tarefas da equipe.</p>
             <nav class="menu-principal" aria-label="Navegação principal">
    <a href="index.html">Kanban</a>
    <!--<a href="index.html" aria-current="page">Kanban</a>-->
    <a href="tarefas.html">Cadastrar tarefa</a>
    <a href="usuarios.html">Usuários</a>
    <!--<a href="projetos.html">Projetos</a>-->
    <a href="projetos.html" aria-current="page">Projetos</a>
</nav>
    </header>

    <main class="projetos-layout">
        <section class="painel" aria-labelledby="titulo-cadastro">
            <h2 id="titulo-cadastro">Dados do projeto</h2>

            <p class="texto-apoio">
                Informe o nome e o objetivo do projeto.
            </p>

            <form id="form-projeto">
                <div class="campo">
                    <label for="nome">Nome do projeto</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        maxlength="100"
                        placeholder="Ex.: Automação da oficina"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>

                    <textarea
                        id="descricao"
                        name="descricao"
                        rows="5"
                        maxlength="2000"
                        placeholder="Descreva o objetivo do projeto."
                        aria-describedby="ajuda-descricao"
                        required
                    ></textarea>

                    <small id="ajuda-descricao">
                        Máximo de 2000 caracteres.
                    </small>
                </div>
                    <div class="acoes-formulario">
                        <button type="submit" id="botao-salvar" disabled>
                            Cadastrar projeto
    </button>

                        <button type="button" id="botao-cancelar" hidden>
                            Cancelar edição
                        </button>
                    </div>
</div>
            </form>

            <p id="mensagem" role="status" aria-live="polite"></p>
        </section>

        <section class="painel" aria-labelledby="titulo-listagem">
            <h2 id="titulo-listagem">Projetos cadastrados</h2>

            <p class="texto-apoio">
                Consulte os projetos disponíveis no sistema.
            </p>

            <ul id="lista-projetos"></ul>
        </section>
    </main>
      <script type="module" src="dist/projetos.js"></script>
</body>

</html>
